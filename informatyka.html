<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Інформатика · У розробці</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,500;0,9..144,700;0,9..144,900;1,9..144,500&family=JetBrains+Mono:wght@400;500&family=Inter+Tight:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #f5f1e8;
    --ink: #1a1814;
    --ink-soft: #4a4640;
    --accent: #c2410c;
    --info: #1e40af;
    --paper: #fdfbf5;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body {
    min-height: 100vh;
    background: var(--bg);
    color: var(--ink);
    font-family: 'Inter Tight', sans-serif;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 40px;
  }
  .grain {
    position: fixed;
    inset: 0;
    pointer-events: none;
    opacity: 0.04;
    background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)'/%3E%3C/svg%3E");
  }
  .wrap {
    max-width: 720px;
    text-align: center;
  }
  .back {
    position: fixed;
    top: 24px;
    left: 32px;
    font-family: 'JetBrains Mono', monospace;
    font-size: 11px;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    color: var(--ink-soft);
    text-decoration: none;
    transition: color 0.2s;
  }
  .back:hover { color: var(--accent); }
  .back::before { content: "← "; color: var(--accent); }

  .tag {
    font-family: 'JetBrains Mono', monospace;
    font-size: 11px;
    letter-spacing: 0.2em;
    text-transform: uppercase;
    color: var(--ink-soft);
    margin-bottom: 24px;
    display: inline-flex;
    align-items: center;
    gap: 10px;
  }
  .tag::before {
    content: "";
    width: 8px;
    height: 8px;
    border-radius: 50%;
    background: var(--info);
  }

  h1 {
    font-family: 'Fraunces', serif;
    font-weight: 900;
    font-size: clamp(48px, 8vw, 96px);
    line-height: 0.95;
    letter-spacing: -0.035em;
    margin-bottom: 28px;
  }
  h1 em {
    font-style: italic;
    color: var(--accent);
    font-weight: 500;
  }

  .lead {
    font-family: 'Fraunces', serif;
    font-size: 22px;
    font-weight: 300;
    line-height: 1.5;
    color: var(--ink-soft);
    margin-bottom: 36px;
  }

  .note {
    font-family: 'JetBrains Mono', monospace;
    font-size: 11px;
    letter-spacing: 0.15em;
    text-transform: uppercase;
    color: var(--ink-soft);
    padding: 16px 24px;
    border: 1px solid var(--ink);
    display: inline-block;
  }
</style>
</head>
<body>

<div class="grain"></div>

<a href="index.html" class="back">До всіх занять</a>

<div class="wrap">
  <div class="tag">інформатика · нуш</div>
  <h1>У <em>розробці</em></h1>
  <p class="lead">
    Сторінка цього заняття зараз готується.
    Поверніться сюди трохи пізніше — або перегляньте поки заняття з математики.
  </p>
  <div class="note">заняття 02 · скоро</div>
</div>

</body>
</html>
